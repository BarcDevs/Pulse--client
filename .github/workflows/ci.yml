name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

jobs:
  ci:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SERVER_URL: http://localhost:4001
      NEXT_PUBLIC_SERVER_API_VERSION: v1
      NEXT_PUBLIC_HOSTNAME: http://localhost:5173
      NEXT_PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: '0'
      NEXT_PUBLIC_SENTRY_DSN: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint . --cache --cache-location .eslintcache

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci

    env:
      NEXT_PUBLIC_SERVER_URL: http://localhost:4001
      NEXT_PUBLIC_SERVER_API_VERSION: v1
      NEXT_PUBLIC_HOSTNAME: http://localhost:5173
      NEXT_PUBLIC_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: '0'
      NEXT_PUBLIC_SENTRY_DSN: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
